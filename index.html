<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ТЕРМИНАЛ ИДЕНТИЧНОСТИ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #e0e0e0;
            --accent-color: #ff003c;
            /* Cyberpunk Red */
            --dim-color: #4a4a4a;
            --grid-color: #1a1a1a;
            --font-main: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            /* CRT Scanline effect */
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
        }

        /* --- RETINA SCAN LOADER --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        .scan-line {
            width: 100%;
            height: 2px;
            background: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-color);
            animation: scan 1.5s infinite linear;
            position: absolute;
            top: 0;
        }

        @keyframes scan {
            0% {
                top: 0%;
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        .loader-text {
            color: var(--accent-color);
            font-size: 14px;
            letter-spacing: 2px;
            margin-top: 20px;
            text-shadow: 0 0 5px var(--accent-color);
        }

        /* --- UI ELEMENTS --- */
        .container {
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            display: none;
            /* Hidden until loaded */
            animation: fadeIn 0.5s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        h1 {
            color: var(--accent-color);
            text-align: center;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 4px;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            position: relative;
        }

        /* Glitch Effect */
        .glitch {
            position: relative;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
        }

        .glitch::before {
            left: 2px;
            text-shadow: -1px 0 #00ffff;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -1px 0 #ff00ff;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% {
                clip: rect(10px, 9999px, 30px, 0);
            }

            20% {
                clip: rect(80px, 9999px, 100px, 0);
            }

            40% {
                clip: rect(10px, 9999px, 50px, 0);
            }

            60% {
                clip: rect(60px, 9999px, 80px, 0);
            }

            80% {
                clip: rect(30px, 9999px, 60px, 0);
            }

            100% {
                clip: rect(90px, 9999px, 120px, 0);
            }
        }

        @keyframes glitch-anim-2 {
            0% {
                clip: rect(50px, 9999px, 70px, 0);
            }

            20% {
                clip: rect(10px, 9999px, 30px, 0);
            }

            40% {
                clip: rect(90px, 9999px, 110px, 0);
            }

            60% {
                clip: rect(20px, 9999px, 40px, 0);
            }

            80% {
                clip: rect(70px, 9999px, 90px, 0);
            }

            100% {
                clip: rect(10px, 9999px, 50px, 0);
            }
        }

        /* TABS */
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            border: 1px solid var(--dim-color);
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            color: var(--dim-color);
            transition: 0.3s;
            font-weight: bold;
            font-size: 14px;
        }

        .tab.active {
            color: var(--bg-color);
            background: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-color);
        }

        /* CARD STYLE */
        .card {
            border: 1px solid var(--dim-color);
            padding: 20px;
            margin-bottom: 20px;
            background: rgba(20, 20, 20, 0.8);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 10px;
            height: 10px;
            border-top: 2px solid var(--accent-color);
            border-left: 2px solid var(--accent-color);
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 10px;
            height: 10px;
            border-bottom: 2px solid var(--accent-color);
            border-right: 2px solid var(--accent-color);
        }

        /* INPUTS */
        textarea {
            width: 100%;
            background: #111;
            border: 1px solid var(--dim-color);
            color: var(--accent-color);
            padding: 10px;
            font-family: inherit;
            margin-top: 10px;
            resize: vertical;
            min-height: 80px;
            outline: none;
            box-sizing: border-box;
        }

        textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 5px rgba(255, 0, 60, 0.5);
        }

        label {
            color: #fff;
            font-size: 12px;
            opacity: 0.7;
            text-transform: uppercase;
        }

        /* BUTTONS */
        .cyber-btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .cyber-btn:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 20px var(--accent-color);
        }

        .cyber-btn:active {
            transform: scale(0.98);
        }

        /* CHART */
        .chart-wrapper {
            position: relative;
            height: 200px;
            width: 100%;
        }

        /* DASHBOARD CARDS */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #141414;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            display: block;
        }

        .stat-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .chart-card {
            background: #141414;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .chart-title {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #fff;
        }
    </style>
</head>

<body>

    <!-- RETINA SCAN LOADER -->
    <div id="loader">
        <div class="scan-line"></div>
        <div style="font-size:40px; color:var(--accent-color);">👁</div>
        <div class="loader-text" id="loader-msg">ИНИЦИАЛИЗАЦИЯ...</div>
    </div>

    <!-- MAIN INTERFACE -->
    <div class="container" id="app">
        <h1 class="glitch" data-text="ТЕРМИНАЛ_ИДЕНТИЧНОСТИ">ТЕРМИНАЛ_ИДЕНТИЧНОСТИ</h1>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('profile')">ДОСЬЕ</div>
            <div class="tab" onclick="switchTab('stats')">ЭНЕРГИЯ</div>
        </div>

        <!-- PROFILE SECTION -->
        <div id="profile-section">

            <!-- VIEW MODE -->
            <div id="profile-view" style="display:none;">
                <div class="card">
                    <label>СТАТУС</label>
                    <div style="color:#0f0; margin-bottom:10px;">● АКТИВЕН</div>

                    <label>ЦЕЛЬ</label>
                    <div id="view-goal"
                        style="color:#fff; margin-bottom:10px; border-bottom:1px dashed #333; padding-bottom:5px;">...
                    </div>

                    <label>СТРАХ</label>
                    <div id="view-fear"
                        style="color:#fff; margin-bottom:10px; border-bottom:1px dashed #333; padding-bottom:5px;">...
                    </div>

                    <label>ЦЕНА</label>
                    <div id="view-price" style="color:#fff; margin-bottom:10px;">...</div>
                </div>
                <button class="cyber-btn" onclick="editProfile()">// ПЕРЕЗАПИСЬ_ДАННЫХ</button>
            </div>

            <!-- EDIT MODE -->
            <div id="profile-edit" style="display:none;">
                <div class="card">
                    <div class="step" id="step1">
                        <label>1. БОЛЬ (ЧТО МЕШАЕТ?)</label>
                        <textarea id="pain"></textarea>
                        <button class="cyber-btn" onclick="nextStep(1)">ДАЛЕЕ >></button>
                    </div>

                    <div class="step" id="step2" style="display:none">
                        <label>2. СТРАХ (ЧЕГО БОИШЬСЯ?)</label>
                        <textarea id="fear"></textarea>
                        <button class="cyber-btn" onclick="nextStep(2)">ДАЛЕЕ >></button>
                    </div>

                    <div class="step" id="step3" style="display:none">
                        <label>3. ЦЕЛЬ (ЧЕГО ХОЧЕШЬ?)</label>
                        <textarea id="goal"></textarea>
                        <button class="cyber-btn" onclick="nextStep(3)">ДАЛЕЕ >></button>
                    </div>

                    <div class="step" id="step4" style="display:none">
                        <label>4. ЦЕНА (ЧЕМ ПОЖЕРТВУЕШЬ?)</label>
                        <textarea id="price"></textarea>
                        <button class="cyber-btn" onclick="saveData()">// ЗАГРУЗКА_В_ЯДРО</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- STATS SECTION -->
        <div id="stats-section" style="display:none;">

            <!-- TOP SCORE CARDS -->
            <div class="stat-grid">
                <div class="stat-card">
                    <span class="stat-value" id="energy-avg-val"
                        style="color: #00ffff; text-shadow: 0 0 10px #00ffff66;">7.0</span>
                    <span class="stat-label">ЭНЕРГИЯ (AVG)</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="discipline-val"
                        style="color: #ff00ff; text-shadow: 0 0 10px #ff00ff66;">92%</span>
                    <span class="stat-label">ДИСЦИПЛИНА</span>
                </div>
            </div>

            <!-- DYNAMICS CHART -->
            <div class="chart-card">
                <div class="chart-title">ДИНАМИКА ЭНЕРГИИ</div>
                <div class="chart-wrapper">
                    <canvas id="energyChart"></canvas>
                </div>
            </div>

            <!-- INFLUENCE CHART -->
            <div class="chart-card">
                <div class="chart-title">СФЕРЫ ВЛИЯНИЯ</div>
                <div class="chart-wrapper">
                    <canvas id="influenceChart"></canvas>
                </div>
            </div>

            <button class="cyber-btn" style="background:#fff; color:#000; border-radius:12px; border:none;"
                onclick="tg.close()">ЗАКРЫТЬ ТЕРМИНАЛ</button>

            <div style="text-align:center; font-size:10px; color:var(--dim-color); margin-top:15px; opacity:0.5;">
                @SelfForger_bot
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // --- LOADER LOGIC ---
        window.onload = function () {
            const msgs = ["ПОДКЛЮЧЕНИЕ...", "СКАНИРОВАНИЕ...", "ДОСТУП РАЗРЕШЕН"];
            let i = 0;
            const interval = setInterval(() => {
                document.getElementById('loader-msg').innerText = msgs[i];
                i++;
                if (i >= msgs.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('loader').style.opacity = '0';
                        setTimeout(() => {
                            document.getElementById('loader').style.display = 'none';
                            document.getElementById('app').style.display = 'block';
                            loadData(); // Load cloud data

                            // Check for tab parameter to auto-switch
                            const urlParams = new URLSearchParams(window.location.search);
                            if (urlParams.get('tab') === 'stats') {
                                setTimeout(() => {
                                    switchTab('stats');
                                }, 100);
                            }
                        }, 500);
                    }, 800);
                }
            }, 800);
        };

        // --- TABS LOGIC ---
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(t => t.classList.remove('active'));

            if (tab === 'profile') {
                tabs[0].classList.add('active');
                document.getElementById('profile-section').style.display = 'block';
                document.getElementById('stats-section').style.display = 'none';
            } else {
                tabs[1].classList.add('active');
                document.getElementById('profile-section').style.display = 'none';
                document.getElementById('stats-section').style.display = 'block';
                renderChart();
            }

            // Trigger haptic only if initiated by user click (event object exists)
            try {
                if (window.event) tg.HapticFeedback.selectionChanged();
            } catch (e) { }
        }

        // --- DATA LOGIC ---
        const data = { pain: "", fear: "", goal: "", price: "" };

        function loadData() {
            tg.CloudStorage.getKeys((err, keys) => {
                if (!err && keys.length > 0) {
                    tg.CloudStorage.getItems(keys, (err, items) => {
                        if (!err && items) {
                            if (items.pain) document.getElementById('pain').value = items.pain;
                            if (items.fear) document.getElementById('fear').value = items.fear;
                            if (items.goal) document.getElementById('goal').value = items.goal;
                            if (items.price) document.getElementById('price').value = items.price;

                            if (items.goal && items.fear && items.price) {
                                showViewMode(items);
                            } else {
                                showEditMode();
                            }
                        }
                    });
                } else {
                    showEditMode();
                }
            });
        }

        function showViewMode(items) {
            document.getElementById('view-goal').innerText = items.goal || "N/A";
            document.getElementById('view-fear').innerText = items.fear || "N/A";
            document.getElementById('view-price').innerText = items.price || "N/A";
            document.getElementById('profile-view').style.display = 'block';
            document.getElementById('profile-edit').style.display = 'none';
        }

        function showEditMode() {
            document.getElementById('profile-view').style.display = 'none';
            document.getElementById('profile-edit').style.display = 'block';
            document.getElementById('step1').style.display = 'block';
        }

        function editProfile() {
            showEditMode();
            tg.HapticFeedback.impactOccurred('medium');
        }

        function nextStep(current) {
            const fields = ['pain', 'fear', 'goal'];
            const val = document.getElementById(fields[current - 1]).value;

            if (!val) {
                tg.HapticFeedback.notificationOccurred('error');
                return;
            }

            // Auto-save step
            tg.CloudStorage.setItem(fields[current - 1], val);

            document.getElementById('step' + current).style.display = 'none';
            document.getElementById('step' + (current + 1)).style.display = 'block';
            tg.HapticFeedback.impactOccurred('light');
        }

        function saveData() {
            const price = document.getElementById('price').value;
            if (!price) {
                tg.HapticFeedback.notificationOccurred('error');
                return;
            }

            // Get all values
            const items = {
                pain: document.getElementById('pain').value,
                fear: document.getElementById('fear').value,
                goal: document.getElementById('goal').value,
                price: price
            };

            // 1. Save to CloudStorage
            tg.CloudStorage.setItem('price', price, (err, saved) => {
                if (!err) {
                    tg.HapticFeedback.notificationOccurred('success');

                    // 2. Send to Bot via sendData (This closes the WebApp and triggers handle_web_app_data)
                    tg.sendData(JSON.stringify(items));

                    // Fallback reload if it doesn't close
                    loadData();
                }
            });
        }

        // --- CHART LOGIC ---
        let chartInstance = null;
        let influenceChartInstance = null;

        function getStatsFromUrl() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const energyRaw = urlParams.get('energy');
                const prodRaw = urlParams.get('prod');

                // Prioritize Productivity (Cyan Graph)
                if (prodRaw) {
                    return {
                        labels: ['1', '2', '3', '4', '5', '6', '7'],
                        values: prodRaw.split(',').map(Number)
                    };
                }

                if (energyRaw) {
                    return {
                        labels: ['1', '2', '3', '4', '5', '6', '7'],
                        values: energyRaw.split(',').map(Number)
                    };
                }
            } catch (e) { console.error(e); }
            return null;
        }

        function renderChart() {
            const stats = getStatsFromUrl();
            const dataPoints = stats ? stats.values : [0, 0, 0, 0, 0, 0, 0];

            // Update TOP CARDS
            // 1. Energy AVG
            const avg = dataPoints.reduce((a, b) => a + b, 0) / dataPoints.length;
            document.getElementById('energy-avg-val').innerText = avg.toFixed(1);

            // 2. Discipline % (Count of non-zero entries in last 7 days)
            const activeDays = dataPoints.filter(v => v > 0).length;
            const discPercent = Math.round((activeDays / 7) * 100);
            document.getElementById('discipline-val').innerText = discPercent + '%';

            // Render Dynamics (Line)
            const ctxLine = document.getElementById('energyChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const gradient = ctxLine.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(0, 255, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 255, 255, 0)');

            chartInstance = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: ['1', '2', '3', '4', '5', '6', '7'],
                    datasets: [{
                        data: dataPoints,
                        borderColor: '#00ffff',
                        backgroundColor: gradient,
                        borderWidth: 2,
                        pointBackgroundColor: '#00ffff',
                        pointBorderColor: '#141414',
                        pointBorderWidth: 2,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, max: 10, grid: { color: '#222' }, ticks: { display: false } },
                        x: { grid: { display: false }, ticks: { color: '#444' } }
                    }
                }
            });

            // Render Influence (Bar)
            const ctxBar = document.getElementById('influenceChart').getContext('2d');
            if (influenceChartInstance) influenceChartInstance.destroy();

            influenceChartInstance = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: ['Бизнес', 'Тело', 'Дух', 'Люди'],
                    datasets: [{
                        data: [75, 40, 90, 60], // Mock for now
                        backgroundColor: ['#00ff88', '#ff0055', '#33ccff', '#ffcc00'],
                        borderRadius: 8,
                        barThickness: 40
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, max: 100, grid: { color: '#222' }, ticks: { display: false } },
                        x: { grid: { display: false }, ticks: { color: '#888' } }
                    }
                }
            });
        }
    </script>
</body>

</html>
